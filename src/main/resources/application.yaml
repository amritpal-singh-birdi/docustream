spring:
  application:
    name: docustream
  config:
    import: "optional:file:.env[.properties]"
  datasource:
    url: jdbc:postgresql://localhost:5433/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    hikari:
      pool-name: docustream-pool
      connection-timeout: 5000
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      "[hibernate.jdbc.time_zone]": UTC
  flyway:
    fail-on-missing-locations: true
management:
  endpoint:
    health: 
      show-details: always
logging:
  level:
    org:
      hibernate:
        SQL: debug   